      <animate attributeName="x" calcMode="discrete" values="68.00;97.72;127.44;157.17;186.89;216.61;246.33;276.06;305.78;335.50;365.22;394.94;424.67;454.39;484.11;513.83;543.56;573.28;603.00;603.00;573.28;543.56;513.83;484.11;454.39;424.67;394.94;365.22;335.50;305.78;276.06;246.33;216.61;186.89;157.17;127.44;97.72;68.00;68.00" keyTimes="0;0.013333;0.026667;0.04;0.053333;0.066667;0.08;0.093333;0.106667;0.12;0.133333;0.146667;0.16;0.173333;0.186667;0.2;0.213333;0.226667;0.24;0.86;0.865556;0.871111;0.876667;0.882222;0.887778;0.893333;0.898889;0.904444;0.91;0.915556;0.921111;0.926667;0.932222;0.937778;0.943333;0.948889;0.954444;0.96;1" dur="11s" repeatCount="indefinite"/>
