<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Jiwoo Jung. Vision-Language-Action and Multi-Agent Systems.</title>
  <desc id="desc">Animated research banner with a dark blue background, a road perspective, detailed ego and traffic vehicles, animated lane markings, visual evidence frames, and connected reasoning nodes. Research areas: autonomous driving, VLM expert routing, and physical consistency.</desc>
  <defs>
