    <text x="103" y="58" fill="#9db7ce" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2.3">AUTONOMOUS DRIVING RESEARCH</text>
    <text x="68" y="133" fill="#f3f8ff" font-family="'Courier New', monospace" font-size="48" font-weight="700" clip-path="url(#typing)">Hi, I'm Jiwoo Jung</text>
