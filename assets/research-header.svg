    <path d="M68 321H1132" stroke="#5c849f" stroke-opacity=".18"/>
    <text x="68" y="342" fill="#6988a3" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.3">DONGGUK UNIVERSITY · COMPUTER SCIENCE AND ARTIFICIAL INTELLIGENCE</text>
