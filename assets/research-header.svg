    <text x="68" y="219" fill="#88a6bf" font-family="Arial, Helvetica, sans-serif" font-size="17">Autonomous Driving · VLM Expert Routing</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">
      <rect x="68" y="261" width="132" height="30" rx="5" fill="#173647" stroke="#2a5a69"/>
      <text x="83" y="280" fill="#7ee4d8">VLA REASONING</text>
      <rect x="210" y="261" width="141" height="30" rx="5" fill="#172d47" stroke="#2c4d6e"/>
      <text x="225" y="280" fill="#a2c8f4">EXPERT ROUTING</text>
      <rect x="361" y="261" width="182" height="30" rx="5" fill="#222c48" stroke="#3b4266"/>
      <text x="376" y="280" fill="#bec2ed">PHYSICAL CONSISTENCY</text>
    </g>
