        <rect x="14" y="34" width="91" height="19" rx="4" fill="#193348" stroke="#355769" stroke-width=".5"/>
        <circle cx="24" cy="43.5" r="2.2" fill="#72dccc"/>
        <text x="32" y="46.5" fill="#9dbdcc" font-family="Arial, Helvetica, sans-serif" font-size="7.5" letter-spacing="1.25">DRIVING SCENE</text>
        <path d="M214 222H231L237 215H264" fill="none" stroke="#85aebe" stroke-opacity=".7" stroke-width=".7"/>
        <text x="271" y="218" fill="#b3d2dc" font-family="'Courier New', monospace" font-size="8" letter-spacing="1.4">EGO</text>
        <text x="17" y="245" fill="#7299ae" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="1">LANE GEOMETRY</text>
        <text x="295" y="245" fill="#7299ae" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="1">VLA REASONING</text>
      </g>
      <rect x=".5" y="20.5" width="387" height="237" rx="11.5" fill="none" stroke="#6c95ad" stroke-opacity=".32"/>
      <path d="M14 20.5H40M.5 34V55M347 20.5H374M387.5 34V55" stroke="#94c6d2" stroke-width="1" stroke-opacity=".7" fill="none"/>
