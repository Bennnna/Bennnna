      <stop stop-color="#071321"/><stop offset=".58" stop-color="#10253a"/><stop offset="1" stop-color="#13253a"/>
    </linearGradient>
    <radialGradient id="ambient"><stop stop-color="#267c9c" stop-opacity=".22"/><stop offset="1" stop-color="#267c9c" stop-opacity="0"/></radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b3b50" stop-opacity=".1"/><stop offset="1" stop-color="#2b6e8d" stop-opacity=".22"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bb2ce" stroke-opacity=".055" stroke-width="1"/></pattern>
    <clipPath id="round"><rect width="1200" height="360" rx="20"/></clipPath>
    <clipPath id="typing"><rect x="68" y="84" width="535" height="65"><animate attributeName="width" calcMode="discrete" values="0.00;29.72;59.44;89.17;118.89;148.61;178.33;208.06;237.78;267.50;297.22;326.94;356.67;386.39;416.11;445.83;475.56;505.28;535.00;535.00;505.28;475.56;445.83;416.11;386.39;356.67;326.94;297.22;267.50;237.78;208.06;178.33;148.61;118.89;89.17;59.44;29.72;0.00;0.00" keyTimes="0;0.013333;0.026667;0.04;0.053333;0.066667;0.08;0.093333;0.106667;0.12;0.133333;0.146667;0.16;0.173333;0.186667;0.2;0.213333;0.226667;0.24;0.86;0.865556;0.871111;0.876667;0.882222;0.887778;0.893333;0.898889;0.904444;0.91;0.915556;0.921111;0.926667;0.932222;0.937778;0.943333;0.948889;0.954444;0.96;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>

    <linearGradient id="scenePanel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1b2a"/><stop offset="1" stop-color="#102b3b"/></linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#122735"/><stop offset="1" stop-color="#1b3a4b"/></linearGradient>
    <linearGradient id="egoBody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ddf1f5"/><stop offset=".42" stop-color="#9cbdcc"/><stop offset="1" stop-color="#577d92"/></linearGradient>
    <linearGradient id="egoGlass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13344a"/><stop offset=".5" stop-color="#2d6078"/><stop offset="1" stop-color="#102a3c"/></linearGradient>
    <linearGradient id="trafficBody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b6c83"/><stop offset="1" stop-color="#1b3c51"/></linearGradient>
    <linearGradient id="attention" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#57dfce" stop-opacity="0"/><stop offset=".7" stop-color="#57dfce" stop-opacity=".07"/><stop offset="1" stop-color="#57dfce" stop-opacity=".17"/></linearGradient>
