        <circle cx="303" cy="120" r="2.8" fill="#73e3ce"><animate attributeName="opacity" values=".45;1;.45" dur="3.4s" repeatCount="indefinite"/></circle>
        <circle r="2" fill="#84ead7" cx="0" cy="0" opacity="0">
