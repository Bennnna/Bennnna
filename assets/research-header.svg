          <path d="M181 214H203L206 224H178Z" fill="#1c4054" stroke="#7399ad" stroke-width=".5"/>
          <path d="M177 195L175 220M207 195L209 220" stroke="#eef8f9" stroke-opacity=".4" stroke-width=".65"/>
          <path d="M173 198L169 200V204H173M211 198L215 200V204H211" fill="#7b9bad" stroke="#b6cdd6" stroke-width=".5"/>
          <path d="M179 180H184M200 180H205" stroke="#e4ffff" stroke-width="2" stroke-linecap="round"/>
          <path d="M177 231H183M201 231H207" stroke="#e2a5a3" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M185 230H199" stroke="#50778d" stroke-width="1"/>
        </g>
        <!-- Reasoning graph and evidence transfers. -->
        <g fill="none" stroke="#518aa1" stroke-opacity=".55" stroke-width=".8">
          <path d="M139 126V85H289M244 110V97H289"/>
          <path d="M310 80L337 97 310 116M310 80V116"/>
